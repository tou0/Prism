# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "prism-net"
description = "Prism libp2p networking layer (transport, discovery, sessions). Placeholder until M2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
prism-core.workspace = true
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "kad",
    "request-response",
    "cbor",
    "macros",
    # M5 (NAT traversal + relays). All four are part of the mandated stack
    # (CLAUDE.md "Mandated stack", spec §6/§17) — no non-libp2p dependency is
    # added. `identify` is load-bearing rather than cosmetic: AutoNAT, DCUtR and
    # relay reservations all rely on the observed-address exchange it provides.
    "identify",
    "autonat",
    "dcutr",
    "relay",
    # QUIC (UDP) alongside TCP: deferred from M2b explicitly "to the milestone
    # that earns it with NAT traversal". UDP hole punching succeeds materially
    # more often than TCP simultaneous-open, which is the whole point of M5.
    # NOTE: QUIC is encrypted by TLS 1.3 (libp2p's audited implementation binding
    # the PeerId into the certificate), not Noise — see docs/net.md.
    "quic",
] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
libp2p-swarm-test = "0.6"
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
