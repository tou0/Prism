# cargo-deny configuration. Runs in CI; breaks the build on advisories,
# disallowed licenses, or unexpected dependency sources.

[advisories]
version = 2
yanked = "deny"
# Documented, reversible risk-acceptances for TRANSITIVE advisories with no
# in-semver fix (libp2p-mdns 0.48 hard-pins hickory-proto 0.25.2, and `paste`
# is unmaintained but has no replacement). Rationale in docs/net.md §Supply chain.
# ==> M4 GATE RESOLVED 2026-07-24 (evidence in docs/net.md; summary in
#     docs/security-debt.md): the hickory advisories are NOT WAN/DHT-reachable —
#     hickory is reached only via libp2p-mdns; libp2p-kad has no hickory/DNS dep
#     and we do not enable libp2p's `dns` transport. Mitigation for WAN-exposed
#     nodes: `--no-mdns` (never opens the mDNS socket). Drop when libp2p-mdns
#     adopts hickory-proto >= 0.26.1. Post-kad gate: `cargo tree -i hickory-proto`
#     must stay libp2p-mdns-only.
ignore = [
    # hickory-proto NSEC3/DNSSEC unbounded loop. NOT COMPILED: reachable only with
    # the dnssec-ring/dnssec-aws-lc-rs feature; libp2p-mdns builds hickory with
    # features=["mdns"] only. Unaffected from hickory >= 0.26.0-beta.1.
    "RUSTSEC-2026-0118",
    # hickory-proto O(n^2) name compression on message ENCODING. NOT WAN/DHT-
    # reachable: the encode path builds only our OWN records (record count is
    # self-bounded, not attacker-controlled); the decode path does not trigger it.
    # Fixed in hickory 0.26.1 (breaking bump; awaits a libp2p-mdns release).
    "RUSTSEC-2026-0119",
    # `paste` proc-macro unmaintained (compile-time only, no runtime surface,
    # no maintained drop-in replacement; pulled transitively).
    "RUSTSEC-2024-0436",
    # M3: `lru` IterMut Stacked-Borrows unsoundness (a Miri-level soundness
    # lint, not a known exploit). Pulled transitively by ratatui 0.29 for its
    # internal render cache; the fix is in lru 0.13 but ratatui 0.29 pins
    # `lru = "0.12"` (no in-semver fix). Local-client-only surface. Not an M4
    # blocker (unrelated to network exposure). Drop when ratatui bumps lru.
    "RUSTSEC-2026-0002",
]

[licenses]
version = 2
# Permissive licenses accepted for dependencies. Our own crates are private
# (publish = false) and carry no license field yet, so they are ignored below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
